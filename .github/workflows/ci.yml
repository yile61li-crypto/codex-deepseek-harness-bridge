name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install the pinned DSH runtime dependency
        run: npm ci --ignore-scripts
      - name: Audit production dependencies against the official registry
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Verify source, tests, and plugin manifests
        run: npm run verify
      - name: Exercise the managed runtime MCP path without a model prompt
        run: npm run test:mcp-live
      - name: Inspect the publishable package
        run: npm run pack:dry-run
      - name: Install and probe the packed artifact
        run: npm run package:smoke
