name: Feature request
description: Propose a focused improvement to the bridge.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired workflow and observable result.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: safety
    attributes:
      label: Permission and safety impact
      description: Note any effect on filesystem access, approvals, networking, or automatic actions.
      placeholder: No new permissions; preserves explicit one-shot approval.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This belongs in the Codex-to-DeepSeek-Harness bridge rather than either upstream project.
          required: true
        - label: I searched existing issues and discussions for a similar request.
          required: true
